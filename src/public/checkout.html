<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ShopEasy</title>
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">ShopEasy</a>
        </div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/products">Products</a>
            <a href="/cart">Cart (<span id="cart-count">0</span>)</a>
            <a href="/orders">Orders</a>
        </div>
    </nav>

    <main class="container">
        <h1>Checkout</h1>
        
        <div class="checkout-container">
            <div class="checkout-form">
                <h2>Shipping Information</h2>
                <form id="checkout-form">
                    <div class="form-group">
                        <label for="customerName">Full Name *</label>
                        <input type="text" id="customerName" name="customerName" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Address *</label>
                        <textarea id="address" name="address" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Place Order</button>
                </form>
            </div>

            <div class="order-summary">
                <h2>Order Summary</h2>
                <div id="order-items">
                    Loading...
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ShopEasy - Powered by AWS CI/CD Pipeline</p>
    </footer>

    <script>
        async function loadOrderSummary() {
            try {
                const response = await fetch('/api/cart');
                const data = await response.json();
                const container = document.getElementById('order-items');
                document.getElementById('cart-count').textContent = data.itemCount || 0;

                if (!data.success || data.cart.length === 0) {
                    container.innerHTML = `
                        <p>Your cart is empty</p>
                        <a href="/products" class="btn btn-secondary">Continue Shopping</a>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="order-items-list">
                        ${data.cart.map(item => `
                            <div class="order-item">
                                <span>${item.product.image} ${item.product.name}</span>
                                <span>${item.quantity} x $${item.product.price.toFixed(2)}</span>
                                <span>$${item.subtotal.toFixed(2)}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="order-total">
                        <strong>Total: $${data.total}</strong>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading order summary:', error);
            }
        }

        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                customerName: document.getElementById('customerName').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value
            };

            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const data = await response.json();

                if (data.success) {
                    alert(`Order placed successfully!\nOrder ID: ${data.order.id}\nTotal: $${data.order.total}`);
                    window.location.href = '/orders';
                } else {
                    alert(data.message || 'Error placing order');
                }
            } catch (error) {
                console.error('Error placing order:', error);
                alert('Error placing order. Please try again.');
            }
        });

        loadOrderSummary();
    </script>
</body>
</html>
